relations:
  larger:
    base:
      - larger than
      - bigger than
    opposite:
      - smaller than
    type: relative_size
  right_of:
    base:
      - right of
      - to the right of
    opposite:
      - left of
      - to the left of
    type: relative_position
  in_front_of:
    base:
      - in front of
      - ahead of
    opposite:
      - behind
      - in back of
    type: relative_position
  south_of:
    base:
      - south of
      - to the south of
    opposite:
      - north of
      - to the north of
    type: absolute_position
  east_of:
    base:
      - east of
      - to the east of
    opposite:
      - west of
      - to the west of
    type: absolute_position
  earlier_than:
    base:
      - earlier than
      - before
    opposite:
      - later than
      - after
    type: relative_event
relation_types_compatibility:
  relative_event:
    - relative_event
    - absolute_position
  relative_size:
    - relative_size
    - relative_position
    - absolute_position
  absolute_position:
    - absolute_position
    - relative_size
  relative_position:
    - relative_position
    - relative_size
